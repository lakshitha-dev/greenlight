id: software-approval
version: "2.1"
entity: BISTEC Solutions
jurisdiction: Sri Lanka
regime: PDPA No. 9 of 2022 (Sri Lanka)
owner: Head of Operations & IT
notes: >
  Owned by Operations. Editing this file changes company policy for every
  decision made after the change. Bump the version on every edit.

requirements:
  - id: R1
    field: kevEntries
    label: No actively-exploited vulnerabilities
    op: eq
    value: 0
    severity: blocking
    authority: ISO 27001 A.8.8

  - id: R2
    field: soc2
    label: SOC 2 Type II report obtainable
    op: exists
    severity: blocking
    authority: ISO 27001 A.5.19

  - id: R3
    field: dpa
    label: Data Processing Agreement available
    op: exists
    severity: blocking
    authority: PDPA 2022 · GDPR Art.28

  - id: R4
    field: criticalCves
    label: Critical CVEs at or below threshold
    op: lte
    value: 5
    severity: warning
    authority: ISO 27001 A.8.8

  - id: R5
    field: privacyGrade
    label: Privacy grade C or better
    op: grade
    value: C
    severity: warning
    authority: ISO 27701

  - id: R6
    field: annualCost
    label: Within delegated spend authority
    op: lte
    value: 500000
    severity: warning
    authority: Finance DoA §4.2
    breach: Escalate to the entity signatory for BISTEC Solutions

  - id: R7
    field: sso
    label: SSO / SAML enforcement supported
    op: isTrue
    severity: warning
    authority: ISO 27001 A.5.16

  - id: R8
    field: subprocessors
    label: Sub-processor list disclosed
    op: exists
    severity: warning
    authority: ISO 27701 §7.2.7
