name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Prisma generates a typed client from the schema; nothing typechecks
      # without it, and no database is contacted to produce it.
      - run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      # The suite mocks every outbound call, so CI needs no database and no
      # secrets. A CISA outage cannot turn this red.
      - name: Test
        run: npm run test

      - name: Build
        run: npx next build
        env:
          # Build-time placeholders. The schema is read, the database is not.
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
          DIRECT_DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
          AUTH_SECRET: placeholder-secret-for-build-only
